<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
:root { --ground: #0b0b0c; --ink: #f4f1ea; --accent: #f2c14e; --font-display: "Pretendard"; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
#root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); color: var(--ink); overflow: hidden; }
.shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.82) 100%); }
.topshade { position:absolute; left:0; right:0; top:0; height:520px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
.kicker { position: absolute; left: 120px; top: 300px; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.kicker b { color: var(--accent); font-weight: 800; }
.line { position: absolute; left: 120px; right: 192px; font-weight: 800; font-size: 82px; line-height: 1.18; letter-spacing: -0.035em; }
.line .w { display: inline-block; margin-right: 0.22em; }
.acc { color: var(--accent); }
.endbg { position: absolute; inset: 0; background: var(--ground); }
.sms { position:absolute; left:120px; right:200px; top:520px; }
.sms .to { font-weight:700; font-size:34px; opacity:0.7; margin-bottom:28px; }
.sms .bubble { display:inline-block; background:#2f7cf6; color:#fff; font-weight:500; font-size:42px; line-height:1.4; padding:28px 36px; border-radius:40px 40px 8px 40px; max-width:760px; }
.list { position:absolute; left:120px; right:140px; top:560px; }
.list .row { display:flex; align-items:center; gap:28px; padding:30px 0; border-bottom:2px solid rgba(244,241,234,0.14); font-weight:700; font-size:56px; letter-spacing:-0.03em; }
.list .row i { font-style:normal; color:var(--accent); font-weight:800; font-size:40px; width:60px; }
.save { position:absolute; left:120px; right:120px; top:560px; }
.save .h { font-weight:800; font-size:92px; letter-spacing:-0.04em; line-height:1.15; }
.save .url { margin-top:40px; display:inline-block; padding:20px 32px; border-radius:24px; background:rgba(242,193,78,0.14); border:2px solid rgba(242,193,78,0.6); color:var(--accent); font-weight:800; font-size:50px; letter-spacing:-0.01em; }
.save ol { margin-top:56px; list-style:none; }
.save li { font-weight:700; font-size:48px; line-height:1.3; margin-bottom:30px; letter-spacing:-0.025em; }
.save li b { color:var(--accent); margin-right:18px; }
.lock { position:absolute; left:120px; right:120px; top:520px; }
.lock .h { font-weight:800; font-size:96px; letter-spacing:-0.04em; line-height:1.1; }
.lock .sub { margin-top:22px; font-weight:500; font-size:40px; opacity:0.72; }
.lock .row { display:flex; align-items:center; gap:30px; margin-top:44px; font-weight:700; font-size:58px; letter-spacing:-0.03em; }
.lock .row .x { width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; background:rgba(230,80,70,0.18); border:3px solid #e65046; color:#ff7a70; }
.lock .row .o { width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; background:rgba(242,193,78,0.14); border:3px solid var(--accent); color:var(--accent); }
.lock .row s { text-decoration-thickness:6px; text-decoration-color:#e65046; }
.free { position:absolute; left:120px; right:120px; top:560px; }
.free .big { font-weight:800; font-size:300px; line-height:1; letter-spacing:-0.05em; color:transparent; -webkit-text-stroke:5px var(--accent); }
.free .chips { margin-top:60px; display:flex; flex-direction:column; gap:26px; align-items:flex-start; }
.free .chip { padding:22px 36px; border-radius:26px; background:rgba(244,241,234,0.08); border:2px solid rgba(244,241,234,0.3); font-weight:700; font-size:52px; letter-spacing:-0.02em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="32.5" data-width="1080" data-height="1920">
  <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-volume="1" data-track-index="9"></audio>
  <audio id="bgm" class="clip" src="assets/bgm.mp3" data-start="0" data-duration="32.5" data-volume="0.14" data-fade-out="1.2" data-track-index="10"></audio>

  <video id="v1" class="clip shot" src="assets/c1.mp4" muted playsinline data-start="0" data-duration="4.5" data-playback-rate="0.67" data-track-index="0"></video>
  <video id="v2" class="clip shot" src="assets/c2.mp4" muted playsinline data-start="4.5" data-duration="4.6" data-playback-rate="0.65" data-track-index="0"></video>
  <div id="card1" class="clip endbg" data-start="9.1" data-duration="7.5" data-track-index="0"></div>
  <video id="v4" class="clip shot" src="assets/c4.mp4" muted playsinline data-start="16.6" data-duration="4.2" data-playback-rate="0.71" data-track-index="0"></video>
  <div id="card2" class="clip endbg" data-start="20.8" data-duration="4.4" data-track-index="0"></div>
  <video id="v3" class="clip shot" src="assets/c3.mp4" muted playsinline data-start="25.2" data-duration="2.8" data-playback-rate="1" data-track-index="0"></video>
  <div id="card3" class="clip endbg" data-start="28.0" data-duration="4.5" data-track-index="0"></div>

  <div id="shade" class="clip shade" data-start="0" data-duration="32.5" data-track-index="2"></div>
  <div id="topshade" class="clip topshade" data-start="0" data-duration="32.5" data-track-index="2"></div>
  <div id="kick" class="clip kicker" data-start="0" data-duration="32.5" data-track-index="3"><b>모르면 손해</b> &nbsp;/&nbsp; 명의도용 방지</div>

  <div id="t1" class="clip line" style="top:1000px" data-start="0" data-duration="2.8" data-track-index="4">
    <span class="w">신분증</span><span class="w">잃어버리고</span><br><span class="w acc">분실신고만</span><span class="w">하셨죠?</span></div>
  <div id="t1b" class="clip line" style="top:1000px" data-start="2.8" data-duration="1.7" data-track-index="4">
    <span class="w">그걸로</span><br><span class="w acc">끝이</span><span class="w acc">아닙니다</span></div>
  <div id="t2" class="clip line" style="top:1000px" data-start="4.5" data-duration="4.6" data-track-index="4">
    <span class="w">내</span><span class="w">이름으로</span><span class="w">새</span><span class="w">개통은</span><br><span class="w acc">따로</span><span class="w">막아야</span><span class="w">합니다</span></div>
  <div id="lock" class="clip lock" data-start="9.1" data-duration="7.5" data-track-index="5">
    <div class="h">가입제한<br><span class="acc">서비스</span></div>
    <div class="sub">켜 두면 내 명의로</div>
    <div class="row r1"><span class="o">○</span>지금 쓰는 번호는 그대로</div>
    <div class="row r2"><span class="x">✕</span><s>새 휴대폰 개통</s></div>
    <div class="row r3"><span class="x">✕</span><s>명의 변경</s></div></div>
  <div id="t4" class="clip line" style="top:1000px" data-start="16.6" data-duration="4.2" data-track-index="4">
    <span class="w">PASS</span><span class="w">앱</span><span class="w">·</span><span class="w">엠세이퍼</span><br><span class="w acc">무료로</span><span class="w">신청</span></div>
  <div id="lst" class="clip list" style="top:700px" data-start="20.8" data-duration="4.4" data-track-index="5">
    <div class="row"><i>01</i>이동전화</div><div class="row"><i>02</i>무선인터넷</div><div class="row"><i>03</i>유선전화</div><div class="row"><i>04</i>유료방송</div></div>
  <div id="t5" class="clip line" style="top:420px" data-start="20.8" data-duration="4.4" data-track-index="4">
    <span class="w acc">가입사실</span><span class="w acc">현황조회</span><br><span class="w">내</span><span class="w">명의</span><span class="w">회선</span><span class="w">한눈에</span></div>
  <div id="t6" class="clip line" style="top:1000px" data-start="25.2" data-duration="2.8" data-track-index="4">
    <span class="w">부모님</span><span class="w">휴대폰에도</span><br><span class="w acc">오늘</span><span class="w">켜</span><span class="w">드리세요</span></div>
  <div id="save" class="clip save" data-start="28.0" data-duration="4.5" data-track-index="5">
    <div class="h">저장해 두고<br>부모님께 보내세요</div>
    <div class="url">PASS 앱 · msafer.or.kr</div>
    <ol><li><b>1</b>가입제한 서비스 켜기</li><li><b>2</b>가입사실 현황조회로 확인</li><li><b>3</b>무료, 통신사 직영점도 가능</li></ol></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
function words(sel, at) { tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.08 }, at); }
function outw(sel, at) { tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, at); }
tl.fromTo("#v1", { scale: 1.0 }, { scale: 1.06, duration: 4.5, ease: "none" }, 0);
tl.fromTo("#v2", { scale: 1.08, x: 0 }, { scale: 1.08, x: -30, duration: 4.6, ease: "none" }, 4.5);
outw("#t1", 2.6); words("#t1b", 2.85); outw("#t1b", 4.3);
words("#t2", 4.6); outw("#t2", 8.9);
tl.fromTo("#lock .h, #lock .sub", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", stagger: 0.25 }, 9.2);
tl.fromTo("#lock .r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 11.0);
tl.fromTo("#lock .r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 13.6);
tl.fromTo("#lock .r3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 14.6);
tl.to("#lock", { opacity: 0, duration: 0.18 }, 16.4);
tl.fromTo("#v4", { scale: 1.0 }, { scale: 1.05, duration: 4.2, ease: "power1.out" }, 16.6);
words("#t4", 16.7); outw("#t4", 20.6);
words("#t5", 20.85); outw("#t5", 25.0);
tl.fromTo("#lst .row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", stagger: 0.2 }, 22.0);
tl.to("#lst", { opacity: 0, duration: 0.18 }, 25.0);
words("#t6", 25.3); outw("#t6", 27.8);
tl.fromTo("#save > *", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.25 }, 28.1);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
