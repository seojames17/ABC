<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
:root { --ground: #0b0b0c; --ink: #f4f1ea; --accent: #f2c14e; --font-display: "Pretendard"; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
#root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); color: var(--ink); overflow: hidden; }
.shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.82) 100%); }
.topshade { position:absolute; left:0; right:0; top:0; height:520px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
.dim { position:absolute; inset:0; background: rgba(8,8,10,0.78); }
.kicker { position: absolute; left: 120px; top: 300px; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.kicker b { color: var(--accent); font-weight: 800; }
.line { position: absolute; left: 120px; right: 192px; font-weight: 800; font-size: 82px; line-height: 1.18; letter-spacing: -0.035em; }
.line .w { display: inline-block; margin-right: 0.22em; }
.acc { color: var(--accent); }
.sub { position: absolute; left: 120px; right: 192px; font-weight: 500; font-size: 36px; line-height: 1.45; opacity: 0.85; letter-spacing: -0.01em; }
.endbg { position: absolute; inset: 0; background: var(--ground); }
.rule { position: absolute; left: 120px; top: 760px; width: 96px; height: 6px; background: var(--accent); }
.appcard { position:absolute; left:120px; top:470px; width:840px; display:flex; align-items:center; gap:40px; }
.appcard img { width:220px; height:220px; border-radius:50px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); }
.appname { font-weight:800; font-size:64px; letter-spacing:-0.03em; }
.appmeta { font-weight:500; font-size:32px; opacity:0.75; margin-top:10px; }
.pill { position:absolute; left:120px; top:1110px; padding:22px 34px; border-radius:999px; background: rgba(242,193,78,0.14); border:2px solid rgba(242,193,78,0.6); font-weight:700; font-size:40px; color: var(--accent); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1080" data-height="1920">
  <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0.2" data-volume="1" data-track-index="9"></audio>
  <audio id="bgm" class="clip" src="assets/bgm.mp3" data-start="0" data-duration="20.5" data-volume="0.14" data-fade-out="1.2" data-track-index="10"></audio>

  <video id="v1" class="clip shot" src="assets/c1.mp4" muted playsinline data-start="0" data-duration="3.6" data-playback-rate="0.84" data-track-index="0"></video>
  <video id="v2" class="clip shot" src="assets/c2.mp4" muted playsinline data-start="3.6" data-duration="3.8" data-playback-rate="0.8" data-track-index="0"></video>
  <video id="v3" class="clip shot" src="assets/c3.mp4" muted playsinline data-start="7.4" data-duration="7" data-playback-rate="0.43" data-track-index="0"></video>
  <video id="v4" class="clip shot" src="assets/c4.mp4" muted playsinline data-start="14.4" data-duration="3.4" data-playback-rate="0.88" data-track-index="0"></video>
  <div id="endbg" class="clip endbg" data-start="17.6" data-duration="2.9" data-track-index="0"></div>

  <div id="dim" class="clip dim" data-start="7.4" data-duration="7" data-track-index="1"></div>
  <div id="shade" class="clip shade" data-start="0" data-duration="17.8" data-track-index="2"></div>
  <div id="topshade" class="clip topshade" data-start="0" data-duration="17.8" data-track-index="2"></div>
  <div id="kick" class="clip kicker" data-start="0" data-duration="17.8" data-track-index="3"><b>모르면 손해</b> &nbsp;/&nbsp; 카드 포인트</div>

  <div id="t1" class="clip line" style="top:1000px" data-start="0" data-duration="3.6" data-track-index="4">
    <span class="w">카드</span><span class="w">포인트,</span><br><span class="w acc">현금으로</span><span class="w">뽑힙니다</span></div>
  <div id="t2" class="clip line" style="top:1000px" data-start="3.6" data-duration="3.8" data-track-index="4">
    <span class="w">카드사마다</span><span class="w">흩어져</span><br><span class="w">다들</span><span class="w acc">잊고</span><span class="w">삽니다</span></div>

  <div id="app" class="clip appcard" data-start="7.5" data-duration="6.9" data-track-index="5">
    <img id="appicon" src="assets/accountinfo.jpg" alt="" />
    <div><div class="appname">어카운트인포</div><div class="appmeta">금융결제원 공식 앱</div></div>
  </div>
  <div id="t3" class="clip line" style="top:820px" data-start="7.7" data-duration="4.2" data-track-index="4">
    <span class="w">모든</span><span class="w">카드사</span><span class="w">포인트를</span><br><span class="w acc">한 번에</span></div>
  <div id="t4" class="clip line" style="top:820px" data-start="11.9" data-duration="2.5" data-track-index="4">
    <span class="w">내</span><span class="w">계좌로</span><br><span class="w acc">바로</span><span class="w">입금</span></div>

  <div id="t5" class="clip line" style="top:1000px" data-start="14.4" data-duration="3.3" data-track-index="4">
    <span class="w">부모님</span><span class="w">휴대폰에</span><br><span class="w acc">제일</span><span class="w acc">많이</span></div>

  <div id="rule" class="clip rule" data-start="17.7" data-duration="2.8" data-track-index="7"></div>
  <div id="t6" class="clip line" style="top:800px; right:300px" data-start="17.7" data-duration="2.8" data-track-index="4">
    <span class="w">오늘</span><span class="w acc">1분</span><br><span class="w">저장해</span><span class="w">두세요</span></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
function words(sel, at) { tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.08 }, at); }
function outw(sel, at) { tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, at); }
tl.fromTo("#v1", { scale: 1.06 }, { scale: 1.0, duration: 3.6, ease: "power2.out" }, 0);
tl.fromTo("#kick", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.1);
words("#t1", 0.1);  outw("#t1", 3.3);
words("#t2", 3.7);  outw("#t2", 7.1);
tl.fromTo("#dim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 7.4);
tl.fromTo("#appicon", { scale: 0.6, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.4)" }, 7.5);
tl.fromTo("#app .appname, #app .appmeta", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", stagger: 0.1 }, 7.75);
words("#t3", 8.0);  outw("#t3", 11.6);
words("#t4", 11.95);
tl.to("#app", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 14.1);
outw("#t4", 14.1);
words("#t5", 14.6); outw("#t5", 17.4);
tl.fromTo("#endbg", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 17.6);
tl.fromTo("#rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 17.8);
words("#t6", 17.85);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
