<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
:root { --ground: #0b0b0c; --ink: #f4f1ea; --accent: #f2c14e; --font-display: "Pretendard"; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
#root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); color: var(--ink); overflow: hidden; }
.shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.82) 100%); }
.topshade { position:absolute; left:0; right:0; top:0; height:520px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
.kicker { position: absolute; left: 120px; top: 300px; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.kicker b { color: var(--accent); font-weight: 800; }
.line { position: absolute; left: 120px; right: 192px; font-weight: 800; font-size: 82px; line-height: 1.18; letter-spacing: -0.035em; }
.line .w { display: inline-block; margin-right: 0.22em; }
.acc { color: var(--accent); }
.endbg { position: absolute; inset: 0; background: var(--ground); }
.sms { position:absolute; left:120px; right:200px; top:520px; }
.sms .to { font-weight:700; font-size:34px; opacity:0.7; margin-bottom:28px; }
.sms .bubble { display:inline-block; background:#2f7cf6; color:#fff; font-weight:500; font-size:42px; line-height:1.4; padding:28px 36px; border-radius:40px 40px 8px 40px; max-width:760px; }
.list { position:absolute; left:120px; right:140px; top:560px; }
.list .row { display:flex; align-items:center; gap:28px; padding:30px 0; border-bottom:2px solid rgba(244,241,234,0.14); font-weight:700; font-size:56px; letter-spacing:-0.03em; }
.list .row i { font-style:normal; color:var(--accent); font-weight:800; font-size:40px; width:60px; }
.save { position:absolute; left:120px; right:120px; top:560px; }
.save .h { font-weight:800; font-size:92px; letter-spacing:-0.04em; line-height:1.15; }
.save .url { margin-top:40px; display:inline-block; padding:20px 32px; border-radius:24px; background:rgba(242,193,78,0.14); border:2px solid rgba(242,193,78,0.6); color:var(--accent); font-weight:800; font-size:50px; letter-spacing:-0.01em; }
.save ol { margin-top:56px; list-style:none; }
.save li { font-weight:700; font-size:48px; line-height:1.3; margin-bottom:30px; letter-spacing:-0.025em; }
.save li b { color:var(--accent); margin-right:18px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="27.2" data-width="1080" data-height="1920">
  <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-volume="1" data-track-index="9"></audio>
  <audio id="bgm" class="clip" src="assets/bgm.mp3" data-start="0" data-duration="27.2" data-volume="0.14" data-fade-out="1.2" data-track-index="10"></audio>

  <video id="v1" class="clip shot" src="assets/c1.mp4" muted playsinline data-start="0" data-duration="6.3" data-playback-rate="0.48" data-track-index="0"></video>
  <div id="card1" class="clip endbg" data-start="6.3" data-duration="2.3" data-track-index="0"></div>
  <video id="v3" class="clip shot" src="assets/c3.mp4" muted playsinline data-start="8.6" data-duration="4.4" data-playback-rate="0.69" data-track-index="0"></video>
  <div id="card2" class="clip endbg" data-start="13.0" data-duration="2.1" data-track-index="0"></div>
  <video id="v4" class="clip shot" src="assets/c4.mp4" muted playsinline data-start="15.1" data-duration="3.7" data-playback-rate="0.82" data-track-index="0"></video>
  <video id="v2" class="clip shot" src="assets/c2.mp4" muted playsinline data-start="18.8" data-duration="3.5" data-playback-rate="0.87" data-track-index="0"></video>
  <div id="card3" class="clip endbg" data-start="22.3" data-duration="4.9" data-track-index="0"></div>

  <div id="shade" class="clip shade" data-start="0" data-duration="27.2" data-track-index="2"></div>
  <div id="topshade" class="clip topshade" data-start="0" data-duration="27.2" data-track-index="2"></div>
  <div id="kick" class="clip kicker" data-start="0" data-duration="27.2" data-track-index="3"><b>모르면 손해</b> &nbsp;/&nbsp; 119 안심콜</div>

  <div id="t1" class="clip line" style="top:1000px" data-start="0" data-duration="3.5" data-track-index="4">
    <span class="w acc">119에</span><span class="w">신고하면</span><br><span class="w">다</span><span class="w">아는</span><span class="w">줄</span><span class="w">아시죠?</span></div>
  <div id="t1b" class="clip line" style="top:1000px" data-start="3.5" data-duration="2.8" data-track-index="4">
    <span class="w">부모님</span><span class="w">병명은</span><br><span class="w acc">미리</span><span class="w acc">알</span><span class="w acc">수</span><span class="w acc">없습니다</span></div>
  <div id="lst" class="clip list" data-start="6.3" data-duration="2.3" data-track-index="5">
    <div class="row"><i>01</i>앓는 질환</div><div class="row"><i>02</i>먹는 약</div><div class="row"><i>03</i>수술 이력</div><div class="row"><i>04</i>보호자 번호</div></div>
  <div id="t2" class="clip line" style="top:1240px" data-start="6.3" data-duration="2.3" data-track-index="4">
    <span class="w acc">119</span><span class="w acc">안심콜</span><span class="w">에</span><br><span class="w">등록해</span><span class="w">두면</span></div>
  <div id="t3" class="clip line" style="top:1000px" data-start="8.6" data-duration="4.4" data-track-index="4">
    <span class="w">신고하는</span><span class="w">순간,</span><br><span class="w acc">구급대원</span><span class="w acc">화면에</span></div>
  <div id="sms" class="clip sms" data-start="13.0" data-duration="2.1" data-track-index="5">
    <div class="to">보호자 휴대폰</div>
    <div class="bubble">[119] 신고 접수 알림</div></div>
  <div id="t4" class="clip line" style="top:1000px" data-start="13.0" data-duration="2.1" data-track-index="4">
    <span class="w">보호자에게도</span><br><span class="w acc">문자</span><span class="w">발송</span></div>
  <div id="t5" class="clip line" style="top:1000px" data-start="15.1" data-duration="3.7" data-track-index="4">
    <span class="w">자녀가</span><span class="w acc">대신</span><span class="w acc">가입</span><br><span class="w">서류</span><span class="w">없이</span></div>
  <div id="t6" class="clip line" style="top:1000px" data-start="18.8" data-duration="3.5" data-track-index="4">
    <span class="w">단,</span><span class="w acc">등록한</span><span class="w acc">그</span><span class="w acc">전화로</span><br><span class="w">신고해야</span><span class="w">합니다</span></div>
  <div id="save" class="clip save" data-start="22.3" data-duration="4.9" data-track-index="5">
    <div class="h">저장해 두고<br>부모님께 보내세요</div>
    <div class="url">u119.nfa.go.kr</div>
    <ol><li><b>1</b>부모님 휴대폰 번호로 등록</li><li><b>2</b>질환 · 약 · 보호자 입력</li><li><b>3</b>등록한 그 전화로 신고</li></ol></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
function words(sel, at) { tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.08 }, at); }
function outw(sel, at) { tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, at); }
tl.fromTo("#v1", { scale: 1.04 }, { scale: 1.0, duration: 6.3, ease: "power2.out" }, 0);
outw("#t1", 3.3); words("#t1b", 3.55); outw("#t1b", 6.1);
tl.fromTo("#lst .row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", stagger: 0.15 }, 6.35);
tl.to("#lst", { opacity: 0, duration: 0.18 }, 8.4);
words("#t2", 6.4); outw("#t2", 8.4);
words("#t3", 8.7); outw("#t3", 12.8);
tl.fromTo("#sms .to", { opacity: 0 }, { opacity: 0.7, duration: 0.3 }, 13.0);
tl.fromTo("#sms .bubble", { opacity: 0, y: 30, scale: 0.94, transformOrigin: "right bottom" }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 13.15);
tl.to("#sms", { opacity: 0, duration: 0.18 }, 14.9);
words("#t4", 13.1); outw("#t4", 14.9);
words("#t5", 15.2); outw("#t5", 18.6);
words("#t6", 18.9); outw("#t6", 22.1);
tl.fromTo("#save > *", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.25 }, 22.4);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
