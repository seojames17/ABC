<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
:root { --ground: #0b0b0c; --ink: #f4f1ea; --accent: #f2c14e; --font-display: "Pretendard"; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
#root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); color: var(--ink); overflow: hidden; }
.shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.82) 100%); }
.topshade { position:absolute; left:0; right:0; top:0; height:520px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
.kicker { position: absolute; left: 120px; top: 300px; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.kicker b { color: var(--accent); font-weight: 800; }
.line { position: absolute; left: 120px; right: 192px; font-weight: 800; font-size: 82px; line-height: 1.18; letter-spacing: -0.035em; }
.line .w { display: inline-block; margin-right: 0.22em; }
.acc { color: var(--accent); }
.hookshade { position:absolute; inset:0; background: linear-gradient(to bottom, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.5) 18%, rgba(0,0,0,0.12) 28%, rgba(0,0,0,0.1) 36%, rgba(0,0,0,0.62) 45%, rgba(0,0,0,0.62) 68%, rgba(0,0,0,0.2) 90%); }
.line { text-shadow: 0 4px 28px rgba(0,0,0,0.45); }
.endbg { position: absolute; inset: 0; background: var(--ground); }
.sms { position:absolute; left:120px; right:200px; top:520px; }
.sms .to { font-weight:700; font-size:34px; opacity:0.7; margin-bottom:28px; }
.sms .bubble { display:inline-block; background:#2f7cf6; color:#fff; font-weight:500; font-size:42px; line-height:1.4; padding:28px 36px; border-radius:40px 40px 8px 40px; max-width:760px; }
.list { position:absolute; left:120px; right:140px; top:560px; }
.list .row { display:flex; align-items:center; gap:28px; padding:30px 0; border-bottom:2px solid rgba(244,241,234,0.14); font-weight:700; font-size:56px; letter-spacing:-0.03em; }
.list .row i { font-style:normal; color:var(--accent); font-weight:800; font-size:40px; width:60px; }
.save { position:absolute; left:120px; right:120px; top:560px; }
.save .h { font-weight:800; font-size:92px; letter-spacing:-0.04em; line-height:1.15; }
.save .url { margin-top:40px; display:inline-block; padding:20px 32px; border-radius:24px; background:rgba(242,193,78,0.14); border:2px solid rgba(242,193,78,0.6); color:var(--accent); font-weight:800; font-size:50px; letter-spacing:-0.01em; }
.save ol { margin-top:56px; list-style:none; }
.save li { font-weight:700; font-size:48px; line-height:1.3; margin-bottom:30px; letter-spacing:-0.025em; }
.save li b { color:var(--accent); margin-right:18px; }
.lock { position:absolute; left:120px; right:120px; top:520px; }
.lock .h { font-weight:800; font-size:96px; letter-spacing:-0.04em; line-height:1.1; }
.lock .sub { margin-top:22px; font-weight:500; font-size:40px; opacity:0.72; }
.lock .row { display:flex; align-items:center; gap:30px; margin-top:44px; font-weight:700; font-size:58px; letter-spacing:-0.03em; }
.lock .row .x { width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; background:rgba(230,80,70,0.18); border:3px solid #e65046; color:#ff7a70; }
.lock .row .o { width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; background:rgba(242,193,78,0.14); border:3px solid var(--accent); color:var(--accent); }
.lock .row s { text-decoration-thickness:6px; text-decoration-color:#e65046; }
.wait { position:absolute; left:120px; right:120px; top:560px; }
.wait .h { font-weight:800; font-size:96px; letter-spacing:-0.04em; line-height:1.1; }
.wait .row { display:flex; align-items:center; gap:30px; margin-top:48px; font-weight:700; font-size:58px; letter-spacing:-0.03em; }
.wait .row .o { width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; background:rgba(242,193,78,0.14); border:3px solid var(--accent); color:var(--accent); }
.free { position:absolute; left:120px; right:120px; top:560px; }
.free .big { font-weight:800; font-size:300px; line-height:1; letter-spacing:-0.05em; color:transparent; -webkit-text-stroke:5px var(--accent); }
.free .chips { margin-top:60px; display:flex; flex-direction:column; gap:26px; align-items:flex-start; }
.free .chip { padding:22px 36px; border-radius:26px; background:rgba(244,241,234,0.08); border:2px solid rgba(244,241,234,0.3); font-weight:700; font-size:52px; letter-spacing:-0.02em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30.4" data-width="1080" data-height="1920">
  <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-volume="1" data-track-index="9"></audio>
  <audio id="bgm" class="clip" src="assets/bgm.mp3" data-start="0" data-duration="30.4" data-volume="0.14" data-fade-out="1.2" data-track-index="10"></audio>

  <video id="v1" class="clip shot" src="assets/c1.mp4" muted playsinline data-start="0" data-duration="5.0" data-playback-rate="0.6" data-track-index="0"></video>
  <video id="v2" class="clip shot" src="assets/c2.mp4" muted playsinline data-start="5.0" data-duration="3.4" data-playback-rate="0.88" data-track-index="0"></video>
  <video id="v3" class="clip shot" src="assets/c3.mp4" muted playsinline data-start="8.4" data-duration="5.2" data-playback-rate="0.57" data-track-index="0"></video>
  <div id="card1" class="clip endbg" data-start="13.6" data-duration="3.9" data-track-index="0"></div>
  <video id="v4" class="clip shot" src="assets/c4.mp4" muted playsinline data-start="17.5" data-duration="5.3" data-playback-rate="0.56" data-track-index="0"></video>
  <img id="v5" class="clip shot" src="assets/p1.jpg" data-start="22.8" data-duration="3.1" data-track-index="0">
  <div id="card3" class="clip endbg" data-start="25.9" data-duration="4.5" data-track-index="0"></div>

  <div id="shade" class="clip shade" data-start="0" data-duration="30.4" data-track-index="2"></div>
  <div id="hookshade" class="clip hookshade" data-start="0" data-duration="5.0" data-track-index="1"></div>
  <div id="topshade" class="clip topshade" data-start="0" data-duration="30.4" data-track-index="2"></div>
  <div id="kick" class="clip kicker" data-start="0" data-duration="30.4" data-track-index="3"><b>모르면 손해</b> &nbsp;/&nbsp; 폭설에 차가 갇히면</div>

  <div id="t1" class="clip line" style="top:900px" data-start="0" data-duration="3.7" data-track-index="4">
    <span class="w">눈길에</span><span class="w">갇혀</span><br><span class="w">창문</span><span class="w">닫고</span><br><span class="w acc">히터만</span><span class="w">트시죠?</span></div>
  <div id="t1b" class="clip line" style="top:1000px" data-start="3.7" data-duration="1.3" data-track-index="4">
    <span class="w acc">위험합니다</span></div>
  <div id="t2" class="clip line" style="top:1000px" data-start="5.0" data-duration="3.4" data-track-index="4">
    <span class="w">히터를</span><span class="w">켰다면</span><br><span class="w">창문은</span><span class="w acc">조금</span><span class="w acc">열기</span></div>
  <div id="t3" class="clip line" style="top:1000px" data-start="8.4" data-duration="5.2" data-track-index="4">
    <span class="w">차</span><span class="w">주변</span><span class="w">눈을</span><span class="w">수시로</span><br><span class="w acc">머플러가</span><span class="w acc">막히지</span><span class="w acc">않게</span></div>
  <div id="wait" class="clip wait" data-start="13.6" data-duration="3.9" data-track-index="5">
    <div class="h">고립되면</div>
    <div class="row r1"><span class="o">○</span>되도록 차 안에서 대기</div>
    <div class="row r2"><span class="o">○</span>한 사람은 꼭 <span class="acc">&nbsp;깨어 있기</span></div></div>
  <div id="t4" class="clip line" style="top:1000px" data-start="17.5" data-duration="4.0" data-track-index="4">
    <span class="w">차를</span><span class="w">두고</span><span class="w">떠난다면</span><br><span class="w acc">열쇠는</span><span class="w acc">꽂아</span><span class="w acc">두고</span></div>
  <div id="t4b" class="clip line" style="top:1000px" data-start="21.5" data-duration="1.3" data-track-index="4">
    <span class="w">연락처도</span><span class="w acc">함께</span></div>
  <div id="t6" class="clip line" style="top:1000px" data-start="22.8" data-duration="3.1" data-track-index="4">
    <span class="w">겨울에</span><span class="w">운전하는</span><br><span class="w acc">부모님께</span><span class="w">보내세요</span></div>
  <div id="save" class="clip save" data-start="25.9" data-duration="4.5" data-track-index="5">
    <div class="h">폭설에<br>차가 갇히면</div>
    <ol><li><b>1</b>히터 켜면 창문 조금 열기</li><li><b>2</b>머플러 주변 눈 수시로 치우기</li><li><b>3</b>차 안 대기, 한 사람은 깨어 있기</li><li><b>4</b>떠날 땐 열쇠·연락처 남기기</li></ol></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
function words(sel, at) { tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.08 }, at); }
function outw(sel, at) { tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, at); }
tl.fromTo("#v1", { scale: 1.0 }, { scale: 1.07, duration: 5.0, ease: "none" }, 0);
outw("#t1", 3.5); words("#t1b", 3.72); outw("#t1b", 4.85);
tl.fromTo("#v2", { x: 0, scale: 1.06 }, { x: -24, scale: 1.06, duration: 3.4, ease: "none" }, 5.0);
words("#t2", 5.1); outw("#t2", 8.2);
tl.fromTo("#v3", { scale: 1.1, y: 0 }, { scale: 1.1, y: -30, duration: 5.2, ease: "none" }, 8.4);
words("#t3", 8.6); outw("#t3", 13.4);
tl.fromTo("#wait .h", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 13.7);
tl.fromTo("#wait .r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 13.9);
tl.fromTo("#wait .r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 15.4);
tl.to("#wait", { opacity: 0, duration: 0.18 }, 17.3);
tl.fromTo("#v4", { scale: 1.0 }, { scale: 1.06, duration: 5.3, ease: "power1.out" }, 17.5);
words("#t4", 17.6); outw("#t4", 21.3); words("#t4b", 21.55); outw("#t4b", 22.65);
tl.fromTo("#v5", { scale: 1.12, x: 20 }, { scale: 1.12, x: -20, duration: 3.1, ease: "none" }, 22.8);
words("#t6", 22.9); outw("#t6", 25.7);
tl.fromTo("#save > .h, #save li", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.2 }, 26.0);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
